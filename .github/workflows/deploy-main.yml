name: Deploy Main Server

on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHub 웹 화면에서 수동 실행 지원

jobs:
  deploy:
    name: Deploy to Main Server
    runs-on: ubuntu-latest

    steps:
      - name: SSH to Main Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAIN_SERVER_HOST }}
          username: ${{ secrets.MAIN_SERVER_USER }}
          key: ${{ secrets.MAIN_SERVER_SSH_KEY }}
          port: ${{ secrets.MAIN_SERVER_PORT || 22 }}
          # 비로그인 셸에서도 nvm으로 설치한 node/npm/pm2를 찾을 수 있도록 PATH를 보강한다.
          envs: PATH
          script_stop: true
          script: |
            set -e

            # 0. node/npm/pm2 PATH 보강 (nvm 등)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$PATH:$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" 2>/dev/null | sort -V | tail -1)/bin"
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.local/bin"

            echo "🚀 [Start] Deploying latest code on main server..."
            echo "🔧 node=$(command -v node || echo none) npm=$(command -v npm || echo none) pm2=$(command -v pm2 || echo none)"

            # 1. 서버 내 프로젝트 폴더로 이동
            TARGET_DIR="${{ secrets.MAIN_SERVER_PATH }}"
            if [ -n "$TARGET_DIR" ]; then
              eval cd "$TARGET_DIR" || { echo "❌ Directory $TARGET_DIR not found!"; exit 1; }
            else
              cd ~/walkbuddy-backend || cd ~/swu-backend || { echo "❌ Project directory not found!"; exit 1; }
            fi

            echo "📁 Working directory: $(pwd)"
            AFTER="$(git rev-parse --short HEAD)"

            # 2. 최신 코드 동기화 (서버는 원격 기준으로 강제 동기화)
            #    - git pull 은 서버 로컬 커밋과 원격 커밋이 divergent 하면 실패하므로
            #      fetch + reset --hard 로 원격 main 기준으로 맞춘다.
            git checkout main
            git fetch origin main
            git reset --hard origin/main
            AFTER="$(git rev-parse --short HEAD)"
            echo "✅ Code updated to $AFTER"

            # 3. 신규 패키지 설치 (있으면)
            if command -v npm &> /dev/null; then
              npm install --omit=dev || npm install
            else
              echo "⚠️ npm not found, skipping install"
            fi

            # 4. PM2 재시작 (PATH 보강 후)
            if command -v pm2 &> /dev/null; then
              pm2 reload all || pm2 restart all
              echo "✅ PM2 reload completed"
            else
              echo "⚠️ PM2 not found, please check server process manager"
            fi

            # 5. 배포 검증
            echo "🔎 Verifying local git commit: $(git rev-parse --short HEAD)"
            sleep 2
            curl -fsS "http://127.0.0.1:${PORT:-3000}/health" || echo "⚠️ /health check failed"

            echo "🎉 [Finish] Main server deployment finished successfully!"

