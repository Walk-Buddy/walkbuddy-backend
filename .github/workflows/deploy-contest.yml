name: Deploy Contest Server

on:
  push:
    branches:
      - contest
  workflow_dispatch: # GitHub 웹 화면에서 수동으로도 'Run workflow'를 누를 수 있게 지원
    inputs:
      backfill_first_image:
        description: '스팟 대표사진(first_image) 백필까지 실행'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Contest Server
    runs-on: ubuntu-latest

    steps:
      - name: SSH to Contest Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTEST_SERVER_HOST }}
          username: ${{ secrets.CONTEST_SERVER_USER }}
          key: ${{ secrets.CONTEST_SERVER_SSH_KEY }}
          port: ${{ secrets.CONTEST_SERVER_PORT || 22 }}
          # 비로그인 셸에서도 nvm으로 설치한 node/npm/pm2를 찾을 수 있도록 PATH를 보강한다.
          envs: PATH
          script_stop: true
          script: |
            set -e

            # 0. node/npm/pm2 PATH 보강 (nvm 등)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$PATH:$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" 2>/dev/null | sort -V | tail -1)/bin"
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.local/bin"

            echo "🚀 [Start] Deploying latest code on contest server..."
            echo "🔧 node=$(command -v node || echo none) npm=$(command -v npm || echo none) pm2=$(command -v pm2 || echo none)"

            # 1. 서버 내 프로젝트 폴더로 이동
            TARGET_DIR="${{ secrets.CONTEST_SERVER_PATH }}"
            if [ -n "$TARGET_DIR" ]; then
              eval cd "$TARGET_DIR" || { echo "❌ Directory $TARGET_DIR not found!"; exit 1; }
            else
              cd ~/swu-backend-contest || cd ~/swu-backend || cd ~/walkbuddy-backend || { echo "❌ Project directory not found!"; exit 1; }
            fi

            echo "📁 Working directory: $(pwd)"
            AFTER="$(git rev-parse --short HEAD)"

            # 2. 최신 코드 pull
            git checkout contest
            git fetch origin contest
            git reset --hard origin/contest
            AFTER="$(git rev-parse --short HEAD)"
            echo "✅ Code updated to $AFTER"

            # 3. 신규 패키지 설치 (있으면)
            if command -v npm &> /dev/null; then
              npm install --omit=dev || npm install
            else
              echo "⚠️ npm not found, skipping install"
            fi

            # 4. PM2 재시작 (PATH 보강 후)
            if command -v pm2 &> /dev/null; then
              pm2 reload all || pm2 restart all
              echo "✅ PM2 reload completed"
            else
              echo "⚠️ PM2 not found, please check server process manager"
            fi

            # 5. 배포 검증
            echo "🔎 Verifying local git commit: $(git rev-parse --short HEAD)"
            sleep 2
            curl -fsS "http://127.0.0.1:${PORT:-4000}/health" || echo "⚠️ /health check failed"

            echo "🎉 [Finish] Deployment finished successfully!"

  # ───────────────────────────────────────────────────────────────
  # 스팟 대표사진(first_image) 백필 — GitHub 웹 수동 실행 전용
  #   Actions 탭 → "Deploy Contest Server" → Run workflow
  #               → backfill_first_image 체크 후 실행
  # ───────────────────────────────────────────────────────────────
  backfill-first-image:
    name: Backfill Spot first_image (manual)
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_first_image }}

    steps:
      - name: SSH to Contest Server and run backfill script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTEST_SERVER_HOST }}
          username: ${{ secrets.CONTEST_SERVER_USER }}
          key: ${{ secrets.CONTEST_SERVER_SSH_KEY }}
          port: ${{ secrets.CONTEST_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$PATH:$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" 2>/dev/null | sort -V | tail -1)/bin"
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.local/bin"

            TARGET_DIR="${{ secrets.CONTEST_SERVER_PATH }}"
            if [ -n "$TARGET_DIR" ]; then
              eval cd "$TARGET_DIR"
            else
              cd ~/swu-backend-contest || cd ~/swu-backend || cd ~/walkbuddy-backend
            fi

            echo "📁 Working directory: $(pwd)"
            echo "🖼️  스팟 대표사진(first_image) 백필 시작..."
            # TourAPI 429(트래픽 초과)를 피하기 위해 요청 간 대기(sleep)를 넉넉히 준다.
            node scripts/backfill-spot-first-image.js --sleep 500
            echo "🎉 first_image 백필 완료"
